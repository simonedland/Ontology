# Optional serving tier for TGO at hundreds of millions of edges (research: docs/scaling.md).
# The DuckDB/Parquet store stays the system of record; this Neo4j is a disposable, rebuildable view
# loaded with `neo4j-admin database import` from <out>/neo4j (written by the duckdb engine).
#
# Air-gapped hosts: on a connected machine `docker pull neo4j:5-community && docker save -o neo4j.tar neo4j:5-community`,
# then `docker load -i neo4j.tar` on the target. Nothing else is downloaded.
#
#   TGO_OUT=/path/to/out NEO4J_PASSWORD=... ./load.sh        # bulk import + start
services:
  neo4j:
    image: neo4j:5.26.32-community@sha256:0a6e7aedf54a531f76286032d4365ead65b11cca05e4a15cdf23b8e53d6db02b   # 5.26 LTS, pinned; GPLv3; use Enterprise if property-level RBAC is required (GDPR field visibility)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-4G}   # size close to the store for interactive speed
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-4G}
      # offline: no usage reports, telemetry, fleet manager or remote browser content
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_client_allow__telemetry: "false"
      NEO4J_server_bolt_telemetry_enabled: "false"
      NEO4J_browser_remote__content__hostname__whitelist: "localhost"
      # never set NEO4J_PLUGINS (downloads jars at start); mount pre-fetched jars at ./plugins:/plugins
    ports:
      - "127.0.0.1:7474:7474"         # browser - localhost only
      - "127.0.0.1:7687:7687"         # bolt    - localhost only
    volumes:
      - neo4j_data:/data
      - ${TGO_OUT:?set TGO_OUT}/neo4j:/import:ro
volumes:
  neo4j_data: {}
